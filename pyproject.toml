[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkit-lite"
version = "0.1.0"
description = "A local RAG system built on the Python Standard Library"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ragkit", "ragkit.learned"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]